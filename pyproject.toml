[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-phdoa"
version = "1.0.0"
description = "Reproducible implementation of session-calibrated physical 2-D DOA estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.0",
  "scipy>=1.11,<1.14",
  "h5py>=3.10,<4",
  "torch==2.5.1",
  "scikit-learn==1.6.1",
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
